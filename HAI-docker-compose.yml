services:
  harvesterai:
    image: dphip/harvesterai:latest
    ports:
      - "7860:7860"
    volumes:
      - harvesterai_data:/data
    restart: unless-stopped
    environment:
      - HARVESTERAI_DATA_DIR=/data

      # Authentication
      - AUTH_MODE=login              # login | name_selector
      - AUTH_SECRET_KEY=change-this-to-a-long-random-string

      # Self-registration
      - SIGNUP_MODE=closed           # closed | code | open
      - SIGNUP_CODE=CHANGEME         # only used if SIGNUP_MODE=code

      # PDF storage
      - PDF_LOCATION=server           # local | server | ignore

      # Initial admin account (only used on first launch)
      - INITIAL_ADMIN_USER=admin
      - INITIAL_ADMIN_PASSWORD=changeme

volumes:
  harvesterai_data:
